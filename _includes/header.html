<header class="site-header">
  <div class="header-inner">
    <div class="header-brand-wrap">
      <a href="{{ site.github.url }}/" class="brand-link">
        <span class="brand-badge">TAIWAN</span>
        <span class="brand-name">ABC TRAVEL BLOG</span>
      </a>
    </div>

    <nav class="main-navigation" aria-label="Main Navigation">
      <ul class="nav-menu">
        <li><a href="{{ site.github.url }}/">Home</a></li>
        {% for item in site.data.settings.menu %}
          <li><a href="{{ site.github.url }}/{{ item.url }}">{{ item.name }}</a></li>
        {% endfor %}
      </ul>
    </nav>

    <div class="header-actions">
      <div class="header-social">
        {% include social-icons.html %}
      </div>
      <div class="header-dark-toggle">
        {% include dark-mode.html %}
      </div>
    </div>
  </div>
</header>
