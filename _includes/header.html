<header class="header">
  <div class="header-banner-wrapper">
    <a href="{{ site.github.url }}/" class="header-banner-link">
      <img src="{{ site.github.url }}/assets/img/banner.jpg" alt="{{ site.title }} Banner" class="banner-img">
      <div class="banner-glass-pill">
        <span class="banner-badge">Taiwan Travel Guide</span>
        <h1 class="banner-title">{{ site.title }}</h1>
        <p class="banner-tagline">{{ site.description }}</p>
      </div>
    </a>
  </div>
  {% include menu.html %}
</header>
