<button id="darkModeToggle" aria-label="Toggle dark mode" title="Toggle dark mode">
  <i id="modeIcon" class="fa fa-moon-o" aria-hidden="true"></i>
</button>
<script>
  (function() {
    var toggle = document.getElementById('darkModeToggle');
    var icon = document.getElementById('modeIcon');
    
    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add('dark-theme');
        if (document.body) document.body.classList.add('dark-theme');
        if (icon) icon.className = 'fa fa-sun-o';
        localStorage.setItem('theme', 'dark');
      } else {
        document.documentElement.classList.remove('dark-theme');
        if (document.body) document.body.classList.remove('dark-theme');
        if (icon) icon.className = 'fa fa-moon-o';
        localStorage.setItem('theme', 'light');
      }
    }

    var isDark = document.documentElement.classList.contains('dark-theme');
    applyTheme(isDark);

    if (toggle) {
      toggle.addEventListener('click', function(e) {
        e.preventDefault();
        var currentlyDark = document.documentElement.classList.contains('dark-theme');
        applyTheme(!currentlyDark);
      });
    }
  })();
</script>
